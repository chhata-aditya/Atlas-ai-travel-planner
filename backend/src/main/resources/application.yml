spring:
  application:
    name: atlas-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/atlas_db
    username: postgres
    password: 1234

  jpa:
    hibernate:
      ddl-auto: validate   # never let Hibernate auto-create tables -- Flyway owns the schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: change-this-to-a-long-random-string-later
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 30